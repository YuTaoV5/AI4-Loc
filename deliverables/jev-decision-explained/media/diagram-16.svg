<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><g data-a="0"><rect x="40" y="45" width="400" height="150" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="62" y="89" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">输入：ℓ与target y</text><text x="62" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">ℓ可微；y是当前正确索引</text></g><g data-a="1"><path d="M455,120 L515,120" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="535" y="45" width="470" height="150" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="557" y="89" font-size="30" fill="#1D1D1F" font-weight="600" text-anchor="start">4组中心化高斯扰动</text><text x="557" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">z = stopgrad(ℓ) + ε</text></g><g data-a="2"><path d="M1020,120 L1080,120" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1100" y="45" width="450" height="150" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="1122" y="89" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">内部概率q</text><text x="1122" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">q = softmax(z)</text></g><g data-a="3"><path d="M1320,210 L1320,280 L900,280 L900,295" fill="none" stroke="#0071E3" stroke-width="3" marker-end="url(#arB)"/><path d="M250,210 L250,255 L770,255 L770,295" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)" stroke-dasharray="8 6"/><text x="300" y="245" font-size="22" fill="#6E6E73" font-weight="400" text-anchor="start">正确索引 y（训练监督）</text><rect x="535" y="305" width="470" height="165" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="557" y="349" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">标签评分 → reward</text><text x="557" y="389" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">按q[y]评分；归一化组内优势A</text><text x="557" y="424" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">reward与A停止梯度</text></g><g data-a="4"><rect x="40" y="305" width="400" height="165" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="62" y="349" font-size="21" fill="#0071E3" font-weight="600" text-anchor="start">损失：CE − mean(A×logdensity)</text><text x="62" y="389" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">logdensity用可微ℓ与固定z</text><text x="62" y="424" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">CE直接监督原始ℓ</text><path d="M515,385 L460,385" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/></g><g data-a="5"><rect x="1100" y="305" width="450" height="165" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="1122" y="349" font-size="30" fill="#0071E3" font-weight="600" text-anchor="start">backward → LoRA</text><text x="1122" y="389" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">优化器不更新冻结骨干</text><path d="M240,485 L240,515 L1320,515 L1320,485" fill="none" stroke="#0071E3" stroke-width="3" marker-end="url(#arB)"/></g><text x="35" y="554" font-size="23" fill="#6E6E73" font-weight="400" text-anchor="start">这是代码中的张量依赖图；RLCD接收logits + target + sigma，q是内部中间量，不是外部API JSON。</text></svg>