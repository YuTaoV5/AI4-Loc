<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><g data-a="0"><rect x="35" y="35" width="740" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="57" y="79" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">① 通用27B：接口有没有价值？</text><text x="57" y="119" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">Decision直接给概率；Chat输出文本</text><text x="57" y="154" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">结构化三问：1.145s 对 2.075s</text></g><g data-a="1"><rect x="825" y="35" width="740" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="847" y="79" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">② PPLX：专用权重要怎样交付？</text><text x="847" y="119" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">CPU卸载 → 全GPU；再看引擎适配</text><text x="847" y="154" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">全GPU同轮：PPLX 5.672s / 通用2.563s</text></g><g data-a="2"><rect x="35" y="275" width="740" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="57" y="319" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">③ 严格限输出：优势还剩多少？</text><text x="57" y="359" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">Chat关闭思考、只输出一个字母</text><text x="57" y="394" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">四任务八步预热：27B减少11.0%耗时</text></g><g data-a="3"><rect x="825" y="275" width="740" height="190" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="847" y="319" font-size="29" fill="#0071E3" font-weight="600" text-anchor="start">④ 同一9B：微调能学到任务吗？</text><text x="847" y="359" font-size="24" fill="#