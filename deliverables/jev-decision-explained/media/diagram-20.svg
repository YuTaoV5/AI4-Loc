<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><text x="65" y="70" font-size="36" fill="#0071E3" font-weight="600" text-anchor="start">分类：9B从66/87提高至78/87（原冻结首诊断标签）</text><text x="65" y="170" font-size="39" fill="#0071E3" font-weight="600" text-anchor="start">效率：八步预热下，整批完成时间减少7.7%–11.0%</text><text x="65" y="270" font-size="35" fill="#1D1D1F" font-weight="600" text-anchor="start">资源：PPLX权重48.59GiB，GPU驻留与执行引擎共同影响时延</text><text x="65" y="370" font-size="39" fill="#1D1D1F" font-weight="600" text-anchor="start">开发：审核标签 → LoRA训练 → 合并服务 → 独立验收</text><text x="65" y="475" font-size="30" fill="#6E6E73" font-weight="400" text-anchor="start">完整步骤、样本合同、脚本与实测来源：见配套文档。</text></svg>