<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><g data-a="0"><rect x="45" y="175" width="350" height="155" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="67" y="219" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">同一完整prompt</text><text x="67" y="259" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">日志 / 问题 / A…E</text><path d="M410,252 L485,252" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/></g><g data-a="1"><rect x="505" y="175" width="430" height="155" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="527" y="219" font-size="29" fill="#0071E3" font-weight="600" text-anchor="start">prefill → 最后位置h</text><text x="527" y="259" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">输入KV / 线性状态</text><text x="527" y="294" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">原LM读出 → 字母logits</text></g><g data-a="2"><path d="M955,252 L1020,135" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="55" width="510" height="155" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1062" y="99" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">单字母Chat</text><text x="1062" y="139" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">取/采样字母 → SSE内容 A</text><text x="1062" y="174" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">第一字母可直接来自prefill</text></g><g data-a="3"><path d="M955,252 L1020,415" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="335" width="510" height="155" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="1062" y="379" font-size="29" fill="#0071E3" font-weight="600" text-anchor="start">Decision</text><text x="1062" y="419" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">选项logits → softmax → 概率</text><text x="1062" y="454" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">不经自由文本解码</text></g><text x="35" y="554" font-size="23" fill="#6E6E73" font-weight="400" text-anchor="start">同一骨干、同一输入前向；Decision直接返回候选分布，Chat输出答案内容。</text></svg>