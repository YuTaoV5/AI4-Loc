<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><rect x="40" y="70" width="420" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="62" y="114" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">输入材料</text><text x="62" y="154" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">日志 / 源码 / 编译产物</text><text x="62" y="189" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">工具提取任务所需证据</text><path d="M480,165 L550,165" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="570" y="70" width="440" height="190" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="592" y="114" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">Decision选择</text><text x="592" y="154" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">首诊断家族 / 候选排序</text><text x="592" y="189" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">供程序分支与工具路由使用</text><path d="M1030,165 L1100,165" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1120" y="70" width="440" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1142" y="114" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">后续Agent</text><text x="1142" y="154" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">读源码 / 符号化 / 比对</text><text x="1142" y="189" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">形成带引用的分析报告</text><text x="60" y="410" font-size="40" fill="#0071E3" font-weight="600" text-anchor="start">开发者把候选、工具和验证器编排成完整应用。</text></svg>