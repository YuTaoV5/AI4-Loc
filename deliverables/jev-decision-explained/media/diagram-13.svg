<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><g data-a="0"><rect x="35" y="40" width="490" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="57" y="84" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">定义任务与标签</text><text x="57" y="124" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">明确第一诊断，而非注入名称</text><text x="57" y="159" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">记录证据片段与审核者</text></g><g data-a="1"><rect x="555" y="40" width="490" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="577" y="84" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">脱敏与输入选择</text><text x="577" y="124" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">日志窗口只保留任务证据</text><text x="577" y="159" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">不拼入case / split / gold</text></g><g data-a="2"><rect x="1075" y="40" width="490" height="190" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="1097" y="84" font-size="28" fill="#0071E3" font-weight="600" text-anchor="start">按机制冻结划分</text><text x="1097" y="124" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">跨内核近似机制归同组</text><text x="1097" y="159" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">train / dev / test不交叉</text></g><g data-a="3"><rect x="35" y="295" width="490" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="57" y="339" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">校验与类别盘点</text><text x="57" y="379" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">检查重复、标签边界、缺类</text><text x="57" y="414" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">生成validation与输入哈希</text></g><g data-a="4"><rect x="555" y="295" width="490" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="577" y="339" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">训练时扩增候选</text><text x="577" y="379" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">5 / 8 / 12候选随机排列</text><text x="577" y="414" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">target随正确项位置更新</text></g><g data-a="5"><rect x="1075" y="295" width="490" height="190" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1097" y="339" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">交付给训练skill</text><text x="1097" y="379" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">private文本保留本地</text><text x="1097" y="414" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">public清单记录哈希和支持数</text></g></svg>