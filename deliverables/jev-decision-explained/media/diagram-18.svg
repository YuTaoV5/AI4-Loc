<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><g data-a="0"><rect x="40" y="45" width="480" height="200" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="62" y="89" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">先定界</text><text x="62" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">Decision选择首诊断家族</text><text x="62" y="164" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">给后续调查一条可质疑线索</text></g><path d="M540,145 L585,145" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><g data-a="1"><rect x="605" y="45" width="440" height="200" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="627" y="89" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">再调查</text><text x="627" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">Chat读源码、核对符号</text><text x="627" y="164" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">保留证据与工具轨迹</text></g><path d="M1065,145 L1110,145" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><g data-a="2"><rect x="1130" y="45" width="430" height="200" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1152" y="89" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">交报告</text><text x="1152" y="129" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">输出候选位置与引用</text><text x="1152" y="164" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">源码命中：均为2/3</text></g><g data-a="3"><rect x="40" y="295" width="730" height="175" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="62" y="339" font-size="30" fill="#0071E3" font-weight="600" text-anchor="start">混合流程：微调前 → 微调后</text><text x="62" y="379" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">模型HTTP：10 → 6 次</text><text x="62" y="414" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">三例总耗时：53.464 → 29.247s</text></g><g data-a="3"><rect x="830" y="295" width="730" height="175" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="852" y="339" font-size="29" fill="#1D1D1F" font-weight="600" text-anchor="start">同轮纯Chat作为完整对照</text><text x="852" y="379" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">微调后：3 HTTP / 23.229s / 2/3命中</text><text x="852" y="414" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">按完整流程选方案，接口与根因指标分开</text></g></svg>