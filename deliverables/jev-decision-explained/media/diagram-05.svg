<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><text x="35" y="35" font-size="25" fill="#6E6E73" font-weight="400" text-anchor="start">输入</text><text x="465" y="35" font-size="25" fill="#6E6E73" font-weight="400" text-anchor="start">共同前向：处理输入 / 建立KV或状态</text><text x="1050" y="35" font-size="25" fill="#6E6E73" font-weight="400" text-anchor="start">输出路径</text><g data-a="0"><text x="35" y="100" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">长篇 / thinking Chat</text><rect x="355" y="62" width="600" height="76" rx="16" fill="#EDF2F7" stroke="none" stroke-width="2"/><text x="380" y="95" font-size="27" fill="#1D1D1F" font-weight="400" text-anchor="start">日志 + 问题 + 候选 → prefill</text><text x="380" y="125" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">读完整输入；缓存命中时可复用前缀</text><path d="M965,98 L1020,98" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="62" width="510" height="84" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1062" y="106" font-size="26" fill="#1D1D1F" font-weight="600" text-anchor="start">首token → 多步decode</text><text x="1045" y="170" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">后续输出读回时，KV继续增长</text></g><g data-a="1"><text x="35" y="212" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">关闭thinking的Chat</text><rect x="355" y="174" width="600" height="76" rx="16" fill="#EDF2F7" stroke="none" stroke-width="2"/><text x="380" y="207" font-size="27" fill="#1D1D1F" font-weight="400" text-anchor="start">日志 + 问题 + 候选 → prefill</text><text x="380" y="237" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">读完整输入；缓存命中时可复用前缀</text><path d="M965,210 L1020,210" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="174" width="510" height="84" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1062" y="218" font-size="26" fill="#1D1D1F" font-weight="600" text-anchor="start">首token → 答案 / JSON</text><text x="1045" y="282" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">仍可能有多个输出token</text></g><g data-a="2"><text x="35" y="324" font-size="28" fill="#1D1D1F" font-weight="600" text-anchor="start">单字母Chat</text><rect x="355" y="286" width="600" height="76" rx="16" fill="#EDF2F7" stroke="none" stroke-width="2"/><text x="380" y="319" font-size="27" fill="#1D1D1F" font-weight="400" text-anchor="start">日志 + 问题 + 候选 → prefill</text><text x="380" y="349" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">读完整输入；缓存命中时可复用前缀</text><path d="M965,322 L1020,322" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="286" width="510" height="84" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1062" y="330" font-size="26" fill="#1D1D1F" font-weight="600" text-anchor="start">首token即答案 A</text><text x="1045" y="394" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">max_tokens=1可无后续decode</text></g><g data-a="3"><text x="35" y="436" font-size="28" fill="#0071E3" font-weight="600" text-anchor="start">通用Decision</text><rect x="355" y="398" width="600" height="76" rx="16" fill="#EDF2F7" stroke="none" stroke-width="2"/><text x="380" y="431" font-size="27" fill="#1D1D1F" font-weight="400" text-anchor="start">日志 + 问题 + 候选 → prefill</text><text x="380" y="461" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">读完整输入；缓存命中时可复用前缀</text><path d="M965,434 L1020,434" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="1040" y="398" width="510" height="84" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="1062" y="442" font-size="26" fill="#0071E3" font-weight="600" text-anchor="start">字母候选分数 → 概率</text><text x="1045" y="506" font-size="21" fill="#6E6E73" font-weight="400" text-anchor="start">不生成文本；仍计算输入</text></g><text x="35" y="554" font-size="23" fill="#6E6E73" font-weight="400" text-anchor="start">机制示意：展示输入与输出职责；方框宽度不代表实测时长。</text></svg>