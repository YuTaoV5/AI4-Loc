<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><rect x="35" y="60" width="490" height="290" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="57" y="104" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">训练集：33条</text><text x="57" y="144" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">模型读取日志、问题与候选</text><text x="57" y="179" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">训练器保存正确类别</text><text x="57" y="214" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">每条每轮4种候选构造</text><text x="57" y="249" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">3轮，共396微步 / 99次更新</text><rect x="555" y="60" width="490" height="290" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="577" y="104" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">开发集：4条</text><text x="577" y="144" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">用于选择保存的epoch</text><text x="577" y="179" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">不参与梯度更新</text><text x="577" y="214" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">选定后导出合并BF16权重</text><text x="577" y="249" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">新数据应扩大审核与类别覆盖</text><rect x="1075" y="60" width="490" height="290" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1097" y="104" font-size="31" fill="#1D1D1F" font-weight="600" text-anchor="start">测试集：87条</text><text x="1097" y="144" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">固定模型后评估</text><text x="1097" y="179" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">每例3种选项排列，多数票</text><text x="1097" y="214" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">Decision与Chat分别统计</text><text x="1097" y="249" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">87条仍是87个案例</text><text x="35" y="554" font-size="23" fill="#6E6E73" font-weight="400" text-anchor="start">旧分类采用原冻结首诊断弱标签；新skill要求审核数据。不是提交或根因金标。</text></svg>