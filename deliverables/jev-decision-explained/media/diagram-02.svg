<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><rect x="40" y="50" width="700" height="350" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="62" y="94" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">输入：证据 + 问题 + 候选</text><text x="62" y="134" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">日志：KASAN use-after-free（合成）</text><text x="62" y="169" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">问题：第一诊断属于什么家族？</text><text x="62" y="204" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">候选：生命周期 / 锁 / RCU</text><text x="62" y="239" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">模型读取证据，完成选择</text><path d="M760,225 L825,225" fill="none" stroke="#6E6E73" stroke-width="3" marker-end="url(#arB)"/><rect x="845" y="50" width="710" height="350" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="867" y="94" font-size="27" fill="#1D1D1F" font-weight="600" text-anchor="start">输出：程序可读取的结果</text><text x="867" y="134" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">choice: memory_lifetime</text><text x="867" y="169" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">生命周期0.90 / 锁0.06 / RCU0.04</text><text x="867" y="204" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">业务代码据此路由工具或后续调查</text><text x="867" y="239" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">示意概率，不是一次真实调用</text></svg>