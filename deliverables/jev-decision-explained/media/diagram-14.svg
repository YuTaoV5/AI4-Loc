<svg style="font-family:Microsoft YaHei,sans-serif" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0071E3"/></marker></defs><rect x="35" y="30" width="1000" height="430" rx="16" fill="#E8F3FF" stroke="#0071E3" stroke-width="2"/><text x="57" y="74" font-size="31" fill="#0071E3" font-weight="600" text-anchor="start">送入Qwen的prompt</text><text x="57" y="114" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">日志：BUG: KASAN: use-after-free …（合成）</text><text x="57" y="149" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">问题：第一条诊断属于哪个故障家族？</text><text x="57" y="184" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">A 越界     B 锁     C 生命周期     D RCU     E 保护</text><text x="57" y="219" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">结尾：只回答一个选项字母</text><text x="57" y="254" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">训练时：5 / 8 / 12选项；每例每轮4次置换</text><rect x="1100" y="100" width="460" height="290" rx="16" fill="#F5F5F7" stroke="none" stroke-width="2"/><text x="1122" y="144" font-size="30" fill="#1D1D1F" font-weight="600" text-anchor="start">训练器保留</text><text x="1122" y="184" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">gold = 生命周期</text><text x="1122" y="219" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">当前字母 = C</text><text x="1122" y="254" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">target = 2（从0起）</text><text x="1122" y="289" font-size="24" fill="#6E6E73" font-weight="400" text-anchor="start">不把target拼入prompt</text><text x="35" y="554" font-size="23" fill="#6E6E73" font-weight="400" text-anchor="start">候选排列变了，target索引必须一起变化；不能只打乱字母、不更新监督目标。</text></svg>