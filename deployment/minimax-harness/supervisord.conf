[unix_http_server]
file=/opt/kernel-insight/supervisor.sock
chmod=0600
[supervisord]
logfile=/opt/kernel-insight/data/supervisor.log
pidfile=/opt/kernel-insight/data/supervisor.pid
childlogdir=/opt/kernel-insight/data
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///opt/kernel-insight/supervisor.sock
[program:minimax-chat]
command=/opt/kernel-insight/runtime/venv/bin/python /opt/kernel-insight/app/scripts/chat-gateway.py --config /opt/kernel-insight/services/minimax/credentials.json
user=root
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/kernel-insight/data/minimax.stdout.log
stderr_logfile=/opt/kernel-insight/data/minimax.stderr.log
[program:kernel-insight]
command=/opt/kernel-insight/runtime/node /opt/kernel-insight/app/server/index.js
directory=/opt/kernel-insight/app
user=kernel-insight
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/kernel-insight/data/web.stdout.log
stderr_logfile=/opt/kernel-insight/data/web.stderr.log
environment=PATH="/opt/kernel-insight/runtime/bin:/opt/kernel-insight/runtime:/usr/bin:/bin",PORT="8787",KERNEL_INSIGHT_DATA_DIR="/opt/kernel-insight/data",KERNEL_AGENT_MODE="dsh",KERNEL_AGENT_ENGINE="closed-loop",KERNEL_AGENT_TRANSPORT="openai",KERNEL_AGENT_PROVIDER="minimax",KERNEL_AGENT_MODEL="MiniMax-M2.7",KERNEL_AGENT_BASE_URL="http://127.0.0.1:11436/v1",KERNEL_AGENT_PYTHON="/opt/kernel-insight/runtime/venv/bin/python",KERNEL_AGENT_SANDBOX="/opt/kernel-insight/app/scripts/agent-sandbox.sh",KERNEL_AGENT_CONCURRENCY="1",KERNEL_AGENT_TIMEOUT_SECONDS="600",KERNEL_AGENT_API_KEY="local",KERNEL_HARNESS_BASE_URL="http://127.0.0.1:11436/v1",KERNEL_HARNESS_MODEL="MiniMax-M2.7",KERNEL_HARNESS_TIMEOUT_SECONDS="1800",KERNEL_HARNESS_MAX_TOKENS="16384",KERNEL_HARNESS_API_KEY="local",KERNEL_SOURCE_TRANSPORT="curl",KERNEL_VERIFIED_SOURCE_REGISTRY="/opt/kernel-insight/verified-source-registry.json",KERNEL_DECISION_BASE_URL="",KERNEL_BENCHMARK_DATASET="/opt/kernel-insight/data/evaluation-datasets/stability-v1",KERNEL_BENCHMARK_HARDWARE_ID="external-minimax-chat/new-host-set-me"
